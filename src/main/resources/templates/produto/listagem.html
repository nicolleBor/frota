<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragmentos/head :: head('Listagem de Produtos')"></head>
<body>
<header th:replace="fragmentos/header :: header('produto')"></header>

<div class="container-fluid" style="max-width: 1200px; margin: 0 auto;">
    <h2 class="text-center">Lista de Produtos</h2>

    <div class="text-center mb-3">
        <a href="/produto/formulario" class="btn btn-primary">📦 Novo Produto</a>
        <a href="/home/dashboard" class="btn btn-info">🏠 Voltar ao Dashboard</a>
    </div>

    <div th:if="${listaProdutos.size() > 0}">
        <table class="table table-hover table-responsive-xl">
            <thead class="thead-light">
                <tr>
                    <th scope="col">Nome</th>
                    <th scope="col">Peso (kg)</th>
                    <th scope="col">Comprimento (m)</th>
                    <th scope="col">Largura (m)</th>
                    <th scope="col">Altura (m)</th>
                    <th scope="col">Volume (m³)</th>
                    <th scope="col">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="produto : ${listaProdutos}">
                    <td th:text="${produto.nome}"></td>
                    <td th:text="${#numbers.formatDecimal(produto.peso, 1, 1)}"></td>
                    <td th:text="${#numbers.formatDecimal(produto.comprimento, 1, 2)}"></td>
                    <td th:text="${#numbers.formatDecimal(produto.largura, 1, 2)}"></td>
                    <td th:text="${#numbers.formatDecimal(produto.altura, 1, 2)}"></td>
                    <td th:text="${#numbers.formatDecimal(produto.volume, 1, 3)}"></td>
                    <td>
                        <a class="btn btn-warning btn-sm" th:href="@{'/produto/formulario?id=' + ${produto.id}}">✏️ Editar</a>
                        <a class="btn btn-danger btn-sm" th:href="@{'/produto/delete/' + ${produto.id}}">🗑️ Excluir</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${listaProdutos.size() == 0}" class="text-center mt-5">
        <p class="text-muted">Nenhum produto cadastrado ainda.</p>
        <a href="/produto/formulario" class="btn btn-primary">📦 Cadastrar Primeiro Produto</a>
    </div>
</div>

<div th:replace="fragmentos/footer :: footer"></div>
</body>
</html>
