<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/head :: head('Formulário Produto')}"></head>
<body>
<header th:replace="fragmentos/header :: header('produto')"></header>

<div class="container-fluid" style="max-width: 700px; margin: 0 auto;">
    <h2 class="text-center" th:text="${produto != null} ? 'Editar Produto' : 'Novo Produto'"></h2>

    <form th:action="@{/produto/salvar}" method="post" th:object="${produto}">
        <input type="hidden" th:field="*{id}"/>

        <div class="form-group">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" th:field="*{nome}" class="form-control" required>
            <div th:if="${#fields.hasErrors('nome')}" class="invalid-feedback d-block" th:errors="*{nome}"></div>
        </div>

        <div class="form-group">
            <label for="peso">Peso (kg):</label>
            <input type="number" id="peso" th:field="*{peso}" class="form-control" step="0.01" min="0.1" max="1000.0" required>
            <div th:if="${#fields.hasErrors('peso')}" class="invalid-feedback d-block" th:errors="*{peso}"></div>
        </div>

        <div class="form-group">
            <label for="comprimento">Comprimento (m):</label>
            <input type="number" id="comprimento" th:field="*{comprimento}" class="form-control" step="0.01" min="0.01" max="5.0" required>
            <div th:if="${#fields.hasErrors('comprimento')}" class="invalid-feedback d-block" th:errors="*{comprimento}"></div>
        </div>

        <div class="form-group">
            <label for="largura">Largura (m):</label>
            <input type="number" id="largura" th:field="*{largura}" class="form-control" step="0.01" min="0.01" max="3.0" required>
            <div th:if="${#fields.hasErrors('largura')}" class="invalid-feedback d-block" th:errors="*{largura}"></div>
        </div>

        <div class="form-group">
            <label for="altura">Altura (m):</label>
            <input type="number" id="altura" th:field="*{altura}" class="form-control" step="0.01" min="0.01" max="3.0" required>
            <div th:if="${#fields.hasErrors('altura')}" class="invalid-feedback d-block" th:errors="*{altura}"></div>
        </div>

        <div class="text-center mt-4">
            <button type="submit" class="btn btn-success">💾 Salvar</button>
            <a href="/produto" class="btn btn-secondary">↩ Voltar</a>
        </div>
    </form>
</div>

<div th:replace="~{fragmentos/footer :: footer}"></div>
</body>
</html>
