<!-- templates/fragmentos/header.html -->
<header th:fragment="header(activePage)">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-3">
        <div class="container-fluid">
            <!-- LOGO -->
            <a class="navbar-brand fw-bold" th:href="@{/home/dashboard}">
                <i class="fas fa-truck me-2"></i>FrotaLux
            </a>

            <!-- Botão de menu responsivo -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menu principal -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">

                    <!-- Início -->
                    <li class="nav-item">
                        <a class="nav-link"
                           th:classappend="${activePage ?: ''} == 'dashboard' ? 'active' : ''"
                           th:href="@{/home/dashboard}">
                            <i class="fas fa-home me-1"></i> Início
                        </a>
                    </li>

                    <!-- Caminhão -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle"
                           id="caminhaoDropdown"
                           role="button"
                           data-bs-toggle="dropdown"
                           aria-expanded="false"
                           th:classappend="${activePage ?: ''} == 'caminhao' ? 'active' : ''"
                           style="cursor: pointer;">
                            <i class="fas fa-truck me-1"></i> Caminhão
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="caminhaoDropdown">
                            <li><a class="dropdown-item" th:href="@{/caminhao}">
                                <i class="fas fa-list me-1"></i> Listagem de Caminhões
                            </a></li>
                            <li><a class="dropdown-item" th:href="@{/caminhao/formulario}">
                                <i class="fas fa-plus me-1"></i> Cadastrar Caminhão
                            </a></li>
                        </ul>
                    </li>

                    <!-- Caixa -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle"
                           id="caixaDropdown"
                           data-bs-toggle="dropdown"
                           aria-expanded="false"
                           style="cursor:pointer;"
                           th:classappend="${activePage ?: ''} == 'caixa' ? 'active' : ''">
                            <i class="fas fa-box me-1"></i> Caixa
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="caixaDropdown">
                            <li><a class="dropdown-item" th:href="@{/caixa}">
                                <i class="fas fa-list me-1"></i> Listagem de Caixas
                            </a></li>
                            <li><a class="dropdown-item" th:href="@{/caixa/formulario}">
                                <i class="fas fa-plus me-1"></i> Cadastrar Caixa
                            </a></li>
                        </ul>
                    </li>

                    <!-- Produto -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle"
                           id="produtoDropdown"
                           data-bs-toggle="dropdown"
                           aria-expanded="false"
                           style="cursor:pointer;"
                           th:classappend="${activePage ?: ''} == 'produto' ? 'active' : ''">
                            <i class="fas fa-cube me-1"></i> Produto
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="produtoDropdown">
                            <li><a class="dropdown-item" th:href="@{/produto}">
                                <i class="fas fa-list me-1"></i> Listagem de Produtos
                            </a></li>
                            <li><a class="dropdown-item" th:href="@{/produto/formulario}">
                                <i class="fas fa-plus me-1"></i> Cadastrar Produto
                            </a></li>
                        </ul>
                    </li>

                    <!-- Solicitação de Transporte -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle"
                           id="solicitacaoDropdown"
                           data-bs-toggle="dropdown"
                           aria-expanded="false"
                           style="cursor:pointer;"
                           th:classappend="${activePage ?: ''} == 'solicitacao' ? 'active' : ''">
                            <i class="fas fa-clipboard-list me-1"></i> Solicitação
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="solicitacaoDropdown">
                            <li><a class="dropdown-item" th:href="@{/solicitacao}">
                                <i class="fas fa-list me-1"></i> Listagem de Solicitações
                            </a></li>
                            <li><a class="dropdown-item" th:href="@{/solicitacao/formulario}">
                                <i class="fas fa-plus me-1"></i> Nova Solicitação
                            </a></li>
                        </ul>
                    </li>
                </ul>

        </div>
    </nav>
</header>
