<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/head :: head('Listagem Caminhão')}"></head>
<body>
<header th:replace="fragmentos/header :: header('caminhao')"></header>

<div class="container-fluid" style="max-width: 1200px; margin: 0 auto;">
    <h2 class="text-center">Lista de Caminhões</h2>

    <div class="text-center mb-3">
        <a href="/caminhao/formulario" class="btn btn-primary">🚛 Novo Caminhão</a>
        <a href="/home/dashboard" class="btn btn-info">🏠 Voltar ao Dashboard</a>
    </div>

    <div th:if="${message != null}" class="alert alert-success alert-dismissible fade show text-center" role="alert">
        [[${message}]]
        <button type="button" class="close btn-sm" data-dismiss="alert" aria-label="Close">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>

    <div th:if="${listaVeiculos.size() > 0}">
        <table class="table table-hover table-responsive-xl">
            <thead class="thead-light">
                <tr>
                    <th scope="col">Modelo</th>
                    <th scope="col">Placa</th>
                    <th scope="col">Ano</th>
                    <th scope="col">Comprimento (m)</th>
                    <th scope="col">Largura (m)</th>
                    <th scope="col">Altura (m)</th>
                    <th scope="col">Metragem Cúbica (m³)</th>
                    <th scope="col">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="caminhao : ${listaVeiculos}">
                    <td th:text="${caminhao.modelo}"></td>
                    <td th:text="${caminhao.placa}"></td>
                    <td th:text="${caminhao.ano}"></td>
                    <td th:text="${#numbers.formatDecimal(caminhao.comprimento, 1, 1)}"></td>
                    <td th:text="${#numbers.formatDecimal(caminhao.largura, 1, 1)}"></td>
                    <td th:text="${#numbers.formatDecimal(caminhao.altura, 1, 1)}"></td>
                    <td th:text="${#numbers.formatDecimal(caminhao.metragemCubica, 1, 1)}"></td>
                    <td>
                        <a th:href="@{'/caminhao/formulario/' + ${caminhao.id}}" title="Editar o Caminhão" class="fa-regular fa-pen-to-square icon-dark"></a> 
                        &nbsp; 
                        <a th:href="@{'/caminhao/delete/' + ${caminhao.id}}" th:caminhaoTitle="${caminhao.placa}" id="btnDelete" title="Apagar este caminhão" class="fa-regular fa-trash-can icon-dark btn-delete"></a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${listaVeiculos.size() == 0}" class="text-center mt-5">
        <p class="text-muted">Nenhum caminhão cadastrado ainda.</p>
        <a href="/caminhao/formulario" class="btn btn-primary">🚛 Cadastrar Primeiro Caminhão</a>
    </div>
</div>

<div th:replace="~{fragmentos/footer :: footer}"></div>
</body>
</html>
