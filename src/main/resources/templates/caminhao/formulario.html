<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/head :: head('Formulário Caminhão')}"></head>
<body>
<header th:replace="fragmentos/header :: header('caminhao')"></header>

<div class="container-fluid" style="max-width: 700px; margin: 0 auto;">
    <h2 class="text-center" th:text="${caminhao != null} ? 'Editar Caminhão' : 'Novo Caminhão'"></h2>

    <form th:action="@{/caminhao/salvar}" method="post" th:object="${caminhao}">
        <input type="hidden" th:field="*{id}"/>

        <div class="form-group">
            <label for="modelo">Modelo:</label>
            <input type="text" id="modelo" th:field="*{modelo}" class="form-control" required>
            <div th:if="${#fields.hasErrors('modelo')}" class="invalid-feedback d-block" th:errors="*{modelo}"></div>
        </div>

        <div class="form-group">
            <label for="placa">Placa:</label>
            <input type="text" id="placa" th:field="*{placa}" class="form-control" required>
            <div th:if="${#fields.hasErrors('placa')}" class="invalid-feedback d-block" th:errors="*{placa}"></div>
        </div>

        <div class="form-group">
            <label for="ano">Ano:</label>
            <input type="number" id="ano" th:field="*{ano}" class="form-control" min="2000" max="2030" required>
            <div th:if="${#fields.hasErrors('ano')}" class="invalid-feedback d-block" th:errors="*{ano}"></div>
        </div>

        <div class="form-group">
            <label for="comprimento">Comprimento (m):</label>
            <input type="number" id="comprimento" th:field="*{comprimento}" class="form-control" step="0.01" min="4.0" max="20.0" required>
            <div th:if="${#fields.hasErrors('comprimento')}" class="invalid-feedback d-block" th:errors="*{comprimento}"></div>
        </div>

        <div class="form-group">
            <label for="largura">Largura (m):</label>
            <input type="number" id="largura" th:field="*{largura}" class="form-control" step="0.01" min="2.0" max="2.6" required>
            <div th:if="${#fields.hasErrors('largura')}" class="invalid-feedback d-block" th:errors="*{largura}"></div>
        </div>

        <div class="form-group">
            <label for="altura">Altura (m):</label>
            <input type="number" id="altura" th:field="*{altura}" class="form-control" step="0.01" min="2.5" max="4.5" required>
            <div th:if="${#fields.hasErrors('altura')}" class="invalid-feedback d-block" th:errors="*{altura}"></div>
        </div>

        <div class="text-center mt-4">
            <button type="submit" class="btn btn-success">💾 Salvar</button>
            <a href="/caminhao" class="btn btn-secondary">↩ Voltar</a>
        </div>
    </form>
</div>

<div th:replace="~{fragmentos/footer :: footer}"></div>
</body>
</html>
