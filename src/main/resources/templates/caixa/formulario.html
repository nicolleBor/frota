<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="fragmentos/head :: head('Cadastro de Caixa')"></head>
<body>
<div th:replace="fragmentos/header :: header"></div>

<div class="container mt-4">
    <h2 th:text="${caixa.id != null} ? 'Editar Caixa' : 'Nova Caixa'"></h2>

    <form th:action="@{/caixa/salvar}" th:object="${caixa}" method="post">
        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" class="form-control" th:field="*{nome}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Volume (m³)</label>
            <input type="number" step="0.01" class="form-control" th:field="*{volume}" required>
        </div>

        <button type="submit" class="btn btn-success">Salvar</button>
        <a class="btn btn-secondary" th:href="@{/caixa}">Cancelar</a>
    </form>
</div>

<div th:replace="fragmentos/footer :: footer"></div>
</body>
</html>
