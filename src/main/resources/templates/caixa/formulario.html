<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/head :: head('Formulário Caixa')}"></head>
<body>
<header th:replace="~{fragmentos/header :: header(activePage='Caixa')}"></header>

<div class="container-fluid" style="max-width: 700px; margin: 0 auto;">
    <h2 class="text-center" th:text="${caixa != null} ? 'Editar Caixa' : 'Nova Caixa'"></h2>

    <form th:action="@{/caixa/salvar}" method="post" th:object="${caixa}">
        <input type="hidden" th:field="*{id}"/>

        <div class="form-group">
            <label for="nome">Nome da Caixa:</label>
            <input type="text" id="nome" th:field="*{nome}" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="largura">Largura (cm):</label>
            <input type="number" id="largura" th:field="*{largura}" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="altura">Altura (cm):</label>
            <input type="number" id="altura" th:field="*{altura}" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="comprimento">Comprimento (cm):</label>
            <input type="number" id="comprimento" th:field="*{comprimento}" class="form-control" required>
        </div>

        <!-- Volume foi removido, pois é calculado automaticamente no backend -->

        <div class="text-center mt-4">
            <button type="submit" class="btn btn-success">💾 Salvar</button>
            <a href="/caixa" class="btn btn-secondary">↩ Voltar</a>
        </div>
    </form>
</div>

<div th:replace="~{fragmentos/footer :: footer}"></div>
</body>
</html>
