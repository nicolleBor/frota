<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="fragmentos/head :: head('Listagem de Caixas')"></head>
<body>
<div th:replace="fragmentos/header :: header"></div>

<div class="container mt-4">
    <h2>Listagem de Caixas</h2>
    <a class="btn btn-primary mb-3" th:href="@{/caixa/formulario}">Nova Caixa</a>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Volume (m³)</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="caixa : ${listaCaixas}">
            <td th:text="${caixa.id}"></td>
            <td th:text="${caixa.nome}"></td>
            <td th:text="${caixa.volume}"></td>
            <td>
                <a class="btn btn-warning btn-sm" th:href="@{'/caixa/formulario?id=' + ${caixa.id}}">Editar</a>
                <a class="btn btn-danger btn-sm" th:href="@{'/caixa/delete/' + ${caixa.id}}">Excluir</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div th:replace="fragmentos/footer :: footer"></div>
</body>
</html>
