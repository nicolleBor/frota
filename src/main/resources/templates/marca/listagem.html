<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragmentos/head :: head('Listagem Marcas')"></head>
<body>
<header th:replace="fragmentos/header :: header('marca')"></header>

<div class="container-fluid" style="max-width: 1000px; margin: 0 auto;">
    <h2 class="text-center">Lista de Marcas</h2>

    <div class="text-center mb-3">
        <a href="/marca/formulario" class="btn btn-primary">🏷️ Nova Marca</a>
        <a href="/home/dashboard" class="btn btn-info">🏠 Voltar ao Dashboard</a>
    </div>

    <div th:if="${lista.size() > 0}">
        <table class="table table-hover table-responsive-xl">
            <thead class="thead-light">
                <tr>
                    <th scope="col">Nome</th>
                    <th scope="col">País</th>
                    <th scope="col">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="marca : ${lista}">
                    <td th:text="${marca.nome}"></td>
                    <td th:text="${marca.pais}"></td>
                    <td>
                        <a th:href="@{/marca/formulario?id={id}(id=${marca.id})}" class="btn btn-warning btn-sm">✏️ Editar</a>
                        <a th:href="@{'/marca/delete/' + ${marca.id}}" class="btn btn-danger btn-sm">🗑️ Excluir</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${lista.size() == 0}" class="text-center mt-5">
        <p class="text-muted">Nenhuma marca cadastrada ainda.</p>
        <a href="/marca/formulario" class="btn btn-primary">🏷️ Cadastrar Primeira Marca</a>
    </div>
</div>

<div th:replace="fragmentos/footer :: footer"></div>
</body>
</html>
