<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/head :: head('Formulário Marca')}"></head>
<body>
<header th:replace="fragmentos/header :: header('marca')"></header>

<div class="container-fluid" style="max-width: 700px; margin: 0 auto;">
    <h2 class="text-center" th:text="${marca != null} ? 'Editar Marca' : 'Nova Marca'"></h2>

    <form th:action="@{/marca/salvar}" method="post" th:object="${marca}">
        <input type="hidden" th:field="*{id}"/>

        <div class="form-group">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" th:field="*{nome}" class="form-control" required>
            <div th:if="${#fields.hasErrors('nome')}" class="invalid-feedback d-block" th:errors="*{nome}"></div>
        </div>

        <div class="form-group">
            <label for="pais">País:</label>
            <input type="text" id="pais" th:field="*{pais}" class="form-control" required>
            <div th:if="${#fields.hasErrors('pais')}" class="invalid-feedback d-block" th:errors="*{pais}"></div>
        </div>

        <div class="text-center mt-4">
            <button type="submit" class="btn btn-success">💾 Salvar</button>
            <a href="/marca" class="btn btn-secondary">↩ Voltar</a>
        </div>
    </form>
</div>

<div th:replace="~{fragmentos/footer :: footer}"></div>
</body>
</html>
